; memento — firmware for the Seeed XIAO ESP32C3 board in ../hw
;
; src_dir points at the Arduino sketch folder, so the exact same tree opens
; in the Arduino IDE (memento_fw/memento_fw.ino) and builds under PlatformIO.
;
;   pio run                build
;   pio run -t upload      build + flash
;   pio device monitor     serial log at 115200

[platformio]
src_dir = memento_fw

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
